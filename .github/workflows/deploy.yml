name: Publish to GitHub Pages

on:
  workflow_dispatch: # これを入れることで手動の「Run workflow」ボタンが出現します

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16 # TurboWarp(scratch-gui)が安定してビルドできるバージョンに指定
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci # エラーを起こしにくいクリーンインストールを実行

      - name: Build Web Version
        run: npm run build # TurboWarpをWebサイト用に出力
        env:
          NODE_ENV: production

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build' # 出来上がった成果物の場所を指定

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
